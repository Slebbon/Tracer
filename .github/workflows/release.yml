name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - name: Check tag and package versions
        run: npm run release:check
      - run: npm run check
      - run: npm run test:core
      - run: npm run test:extension
      - name: Build installable packages
        run: |
          npm run package:extension
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run package:godot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $releaseVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release create $env:RELEASE_TAG "tracer-$releaseVersion.vsix" "tracer-godot-$releaseVersion.zip" --verify-tag --title "Tracer $env:RELEASE_TAG" --notes-file CHANGELOG.md
